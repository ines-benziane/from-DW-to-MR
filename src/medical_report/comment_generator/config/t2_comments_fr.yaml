elevated_threshold_ms: 39

categories:
  normal_strict:
    condition: "nb_elevated == 0 and max_T2 < 39"
    template: "Valeurs des moyennes du T2 musculaire dans la norme."

  normal_borderline:
    condition: "nb_elevated == 0 and max_T2 >= 39"
    template: "Valeurs de T2 dans la norme, suggérant que les processus pathologiques sont peu actifs."

  discrete:
    condition: "nb_elevated == 1"
    template: "Discrète élévation de la moyenne du T2 musculaire en regard du muscle {muscles} suggérant l'existence de processus pathologiques actifs."

  moderate:
    condition: "nb_elevated >= 2 and nb_elevated <= 3"
    template: "Élévation modérée et significative des moyennes du T2 musculaire dans plusieurs territoires musculaires suggérant l'existence de processus pathologiques actifs."

  significant:
    condition: "nb_elevated >= 4"
    template: "Élévation significative des moyennes du T2 musculaire dans plusieurs territoires musculaires suggérant l'existence de processus pathologiques actifs."
