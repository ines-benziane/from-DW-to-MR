elevated_threshold_ms: 39

categories:
  normal_strict:
    condition: "nb_elevated == 0 and max_T2 < 39"
    template: "Valeurs des moyennes du T2 musculaire dans la norme."

  normal_borderline:
    condition: "nb_elevated == 0 and max_T2 >= 39"
    template: "Valeurs de T2 dans la norme, suggérant que les processus inflammatoires et lésionnels sont peu actifs."

  discrete:
    condition: "nb_elevated == 1"
    template: "Discrète augmentation de la moyenne du T2 musculaire en regard de {muscles} suggérant l'existence de processus inflammatoires/lésionnels actifs."

  moderate:
    condition: "nb_elevated >= 2 and nb_elevated <= 3"
    template: "Augmentation modérée et significative des moyennes du T2 musculaire dans plusieurs territoires musculaires suggérant l'existence de processus inflammatoires/lésionnels actifs."

  significant:
    condition: "nb_elevated >= 4"
    template: "Augmentation significative des moyennes du T2 musculaire dans plusieurs territoires musculaires suggérant l'existence de processus inflammatoires/lésionnels actifs."
